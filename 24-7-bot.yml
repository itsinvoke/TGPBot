name: 24/7 TGPBot & Discord Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Guard Bot & Discord Bot (24/7)
        env:
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
          MC_VERSION: ${{ secrets.MC_VERSION }}
          MC_TIMEOUT: ${{ secrets.MC_TIMEOUT }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          WHITELIST: ${{ secrets.WHITELIST }}
          GUARD_WEBHOOK_URL: ${{ secrets.GUARD_WEBHOOK_URL }}
          GUARD_ALERT_ROLE_ID: ${{ secrets.GUARD_ALERT_ROLE_ID }}
          GUARD_HTTP_PORT: ${{ secrets.GUARD_HTTP_PORT }}
          CLAN_AD: ${{ secrets.CLAN_AD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ALERT_CHANNEL_ID: ${{ secrets.ALERT_CHANNEL_ID }}
          ADMIN_CHANNEL_ID: ${{ secrets.ADMIN_CHANNEL_ID }}
          DISCORD_HTTP_PORT: ${{ secrets.DISCORD_HTTP_PORT }}
        run: |
          echo "=========================================="
          echo "🤖 TGPBot 24/7 - GitHub Actions"
          echo "=========================================="
          echo ""
          echo "🎮 Starting Guard Bot (Minecraft Protection)"
          echo "🤖 Starting Discord Bot (Alert Relay)"
          echo ""
          
          node guard_bot.js &
          GUARD_PID=$!
          
          node discord_bot.js &
          DISCORD_PID=$!
          
          echo "Guard Bot PID: $GUARD_PID"
          echo "Discord Bot PID: $DISCORD_PID"
          echo ""
          
          while true; do
            if ! kill -0 $GUARD_PID 2>/dev/null; then
              echo "[$(date)] ⚠️ Guard Bot crashed, restarting..."
              node guard_bot.js &
              GUARD_PID=$!
              sleep 2
            fi
            
            if ! kill -0 $DISCORD_PID 2>/dev/null; then
              echo "[$(date)] ⚠️ Discord Bot crashed, restarting..."
              node discord_bot.js &
              DISCORD_PID=$!
              sleep 2
            fi
            
            sleep 10
          done
