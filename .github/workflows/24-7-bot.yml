# CI workflow to ensure DISCORD_TOKEN is present, write .env, and run the bot.
# Paste this into .github/workflows/fix-discord-token.yml
# If you stored the secret under Settings → Environments → <env-name> → Secrets,
# uncomment and set `environment:` to that environment name below.
name: Run TGPBot (with DISCORD_TOKEN check)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Optionally enable for other branches or events as needed.

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # If you used an Environment-level secret, uncomment and set the environment name:
    # environment: my-environment-name
    # Expose the secret to steps via job-level env (safe: value is never printed)
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DISCORD_TOKEN is set (safe — does not print the token)
        run: |
          # Detect pull_request runs which may come from forks where secrets are not exposed
          if [ -z "${DISCORD_TOKEN}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::error ::FATAL: DISCORD_TOKEN is NOT set. This run was triggered by a pull_request and may be from a fork; repository secrets are not exposed to fork PRs."
            else
              echo "::error ::FATAL: DISCORD_TOKEN is NOT set"
            fi
            exit 1
          else
            echo "DISCORD_TOKEN is set (value hidden)"
          fi

      - name: Create .env from DISCORD_TOKEN (if your app expects a .env file)
        run: |
          cat > .env <<EOF
          DISCORD_TOKEN=${DISCORD_TOKEN}
          EOF
          echo ".env written (token not shown in logs)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # adjust if your project requires a different Node version

      - name: Install dependencies
        run: |
          npm ci

      - name: Run bot (example)
        env:
          # map the secret into the runtime step as well (keeps it available to the process)
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # Replace the following with your actual start command if different:
          npm start
